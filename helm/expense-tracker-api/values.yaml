replicaCount: 1

image:
  repository: somanathmuduli03/expensetracker
  tag: "1.4"
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-secret

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

namespace: dev

ingress:
  host: api.afet.online
  tlsSecretName: api-afet-tls

config:
  azureSqlServer: "et-db.database.windows.net"
  azureSqlDb: "free-sql-db-3281680"

secret:
  azureSqlUser: "azureuser@et-db"
  azureSqlPassword: ""
  jwtSecret: ""
