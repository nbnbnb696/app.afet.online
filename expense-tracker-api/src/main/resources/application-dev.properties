spring.datasource.url=jdbc:sqlserver://${AZURE_SQL_SERVER}:1433;databaseName=${AZURE_SQL_DB};encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.username=${AZURE_SQL_USER}
spring.datasource.password=${AZURE_SQL_PASSWORD}
jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
