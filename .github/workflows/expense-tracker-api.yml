name: expense-tracker-api

on:
  push:
    branches:
      # - dev
      - qa
    # paths:
    #   - 'expense-tracker-api/**'
    #   - 'helm/expense-tracker-api/**'

env:
  IMAGE_NAME: somanathmuduli03/expensetracker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV=qa" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: expense-tracker-api

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./expense-tracker-api
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.ENV }}-latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: expense-tracker-app
          cluster-name: et-dev
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create dockerhub secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-server=https://index.docker.io/v1/ \
            -n qa \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install expense-tracker-api ./helm/expense-tracker-api \
            -f ./helm/expense-tracker-api/values-qa.yaml \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set secret.azureSqlPassword=${{ secrets.AZURE_SQL_PASSWORD }} \
            --set secret.jwtSecret=${{ secrets.JWT_SECRET }} \
            -n qa --create-namespace \
            --wait
